name: Build and Release

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Expose the optional personal token as a job env so we can safely reference it
      STARMAP_NUGET_TOKEN: ${{ secrets.STARMAP_NUGET_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
      shell: bash

    - name: Clone KSA DLLs
      run: |
        git clone git@github.com:MarcusZuber/KSA_dlls.git KSA_dlls
      shell: bash

    - name: Add StarMap GitHub Packages NuGet feed (using personal token)
      if: ${{ env.STARMAP_NUGET_TOKEN != '' }}
      run: |
        try { dotnet nuget remove source StarMap } catch { }
        # Use the job environment variable in PowerShell
        dotnet nuget add source "https://nuget.pkg.github.com/StarMapLoader/index.json" --name "StarMap" --username "${{ github.actor }}" --password "$env:STARMAP_NUGET_TOKEN" --store-password-in-clear-text
      shell: powershell

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Create Release Package
      run: |
        $project = 'KittenRemoteControl'
        Write-Host "Creating release package for $project..."

        $outputDir = "$project/bin/Release/net9.0"
        
        if (-not (Test-Path $outputDir)) {
          Write-Error "Build output not found at: $outputDir"
          Write-Host "Listing directory structure:"
          Get-ChildItem -Path . -Recurse -Directory | Where-Object { $_.Name -match "bin" } | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
          exit 1
        }

        Write-Host "Found build output: $outputDir"

        # Create package/KittenRemoteControl structure
        $packageDir = "package"
        $contentDir = "$packageDir/$project"
        if (Test-Path $packageDir) { Remove-Item -Recurse -Force $packageDir }
        New-Item -ItemType Directory -Path $contentDir -Force | Out-Null

        $excludeDlls = @(
          'KSA.dll', 'Brutal.Core.Numerics.dll', 'Brutal.Glfw.dll',
          'Brutal.ImGui.dll', 'Brutal.ImGui.Extensions.dll',
          'Brutal.Core.Collections.dll', 'Brutal.Core.Common.dll',
          'Brutal.Core.Logging.dll', 'Brutal.Core.Memory.dll',
          'Brutal.Core.Strings.dll', 'Brutal.Fmod.dll',
          'Brutal.Framework.dll', 'Brutal.Gli.dll',
          'Brutal.Gli.Texture.dll', 'Brutal.GltfApi.dll',
          'Brutal.ImGui.Abstractions.dll', 'Brutal.Ktx.dll',
          'Brutal.Ktx.Texture.dll', 'Brutal.Native.dll',
          'Brutal.ShaderCompiler.dll', 'Brutal.Stb.dll',
          'Brutal.Stb.Texture.dll', 'Brutal.Texture.dll',
          'Brutal.Vulkan.dll', 'Brutal.Vulkan.Abstractions.dll',
          'StarMap.API.dll', '0Harmony.dll'
        )

        Write-Host "Copying DLLs..."
        $copied = 0
        $skipped = 0
        Get-ChildItem -Path $outputDir -Filter '*.dll' -File | ForEach-Object {
          if ($excludeDlls -notcontains $_.Name) {
            Copy-Item $_.FullName -Destination $contentDir -Force
            Write-Host "  OK $($_.Name)"
            $copied++
          } else {
            $skipped++
          }
        }
        Write-Host "Copied $copied DLLs, skipped $skipped"

        $depsFile = Get-Item "$outputDir/$project.deps.json" -ErrorAction SilentlyContinue
        if ($depsFile) {
          Copy-Item $depsFile.FullName -Destination $contentDir -Force
          Write-Host "OK Copied deps.json"
        }

        if (Test-Path "$project/mod.toml") {
          Copy-Item "$project/mod.toml" -Destination $contentDir -Force
          Write-Host "OK Copied mod.toml"
        }

        $docFiles = @('README.md', 'LICENSE', 'NOTICE.txt', 'openapi.yaml')
        foreach ($file in $docFiles) {
          if (Test-Path $file) {
            Copy-Item $file -Destination $contentDir -Force
            Write-Host "OK Copied $file"
          }
        }

        if (Test-Path 'licenses') {
          Copy-Item 'licenses' -Destination $contentDir -Recurse -Force
          Write-Host "OK Copied licenses/"
        }

        Write-Host ""
        Write-Host "Package structure: package/KittenRemoteControl/(files)"
        Write-Host "Package contents:"
        Get-ChildItem -Path $contentDir -Recurse | ForEach-Object {
          if (-not $_.PSIsContainer) {
            Write-Host "  $($_.Name)"
          }
        }
        Write-Host ""
        Write-Host "Package ready in: $packageDir"
      shell: powershell

    - name: Clean up SSH key
      if: always()
      run: |
        rm -f ~/.ssh/id_rsa
      shell: bash

    - name: Remove cloned DLLs
      if: always()
      run: |
        Remove-Item -Recurse -Force KSA_dlls -ErrorAction SilentlyContinue
      shell: powershell

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KittenRemoteControl
        path: package/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: package/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
