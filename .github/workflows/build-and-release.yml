name: Validate release package
on:
  push:
    branches: [main, master, develop, fix/wine-httplistener-tcp-server]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # KSA assemblies are proprietary and are not available on hosted runners.
      # Build locally against real installed assemblies, then commit the refreshed
      # prebuilt runtime and its source fingerprint. Never publish a stub build.
      - name: Verify prebuilt source and file hashes, package and test
        shell: pwsh
        run: ./package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KittenRemoteControl-release
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
