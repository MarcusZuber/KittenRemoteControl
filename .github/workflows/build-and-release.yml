name: Validate release package
on:
  push:
    branches: [main, master, develop, feature/telemachus-microblocks-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run regression checks without game stubs
        shell: pwsh
        run: dotnet run --project tests/RegressionTests.csproj --configuration Release
      # KSA assemblies are proprietary and are not available on hosted runners.
      # Build locally against real installed assemblies, then commit the refreshed
      # prebuilt runtime and its source fingerprint. Never publish a stub build.
      - name: Verify prebuilt source and file hashes, package and test
        shell: pwsh
        run: ./package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KittenRemoteControl-release
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
