name: Build and Release

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Expose the optional personal token as a job env so we can safely reference it
      STARMAP_NUGET_TOKEN: ${{ secrets.STARMAP_NUGET_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
      shell: bash

    - name: Clone KSA DLLs
      run: |
        git clone git@github.com:MarcusZuber/KSA_dlls.git KSA_dlls
      shell: bash

    - name: Add StarMap GitHub Packages NuGet feed (using personal token)
      if: ${{ env.STARMAP_NUGET_TOKEN != '' }}
      run: |
        try { dotnet nuget remove source StarMap } catch { }
        # Use the job environment variable in PowerShell
        dotnet nuget add source "https://nuget.pkg.github.com/StarMapLoader/index.json" --name "StarMap" --username "${{ github.actor }}" --password "$env:STARMAP_NUGET_TOKEN" --store-password-in-clear-text
      shell: powershell

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Create Release Package
      run: |
        $project = 'KittenRemoteControl'
        Write-Host "Creating release package for $project..."

        # Use direct path to build output
        $outputDir = "$project/bin/Release/net9.0"
        
        if (-not (Test-Path $outputDir)) {
          Write-Host "Build output not found at: $outputDir"
          Write-Host "Searching for build output..."
          
          # Fallback: Search for the output directory
          $foundDir = Get-ChildItem -Path . -Filter "net9.0" -Directory -Recurse -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match "\\bin\\Release\\net9.0" -and $_.FullName -notmatch "\\obj\\" } |
                      Select-Object -First 1
          
          if ($foundDir) {
            $outputDir = $foundDir.FullName
            Write-Host "Found build output at: $outputDir"
          } else {
            Write-Host "Available directories:"
            Get-ChildItem -Path . -Recurse -Directory | Where-Object { $_.FullName -match "bin" } | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "Could not find build output directory. Build may have failed."
            exit 1
          }
        } else {
          Write-Host "Found build output: $outputDir"
        }

        $contentDir = $project

        # Create directories
        if (Test-Path $contentDir) { Remove-Item -Recurse -Force $contentDir }
        New-Item -ItemType Directory -Path $contentDir -Force | Out-Null

        # Define DLLs to exclude (game files + already provided by mod loader)
        $excludeDlls = @(
          # Kitten Space Agency game files (proprietary)
          'KSA.dll',
          'Brutal.Core.Numerics.dll',
          'Brutal.Glfw.dll',
          'Brutal.ImGui.dll',
          'Brutal.ImGui.Extensions.dll',
          'Brutal.Core.Collections.dll',
          'Brutal.Core.Common.dll',
          'Brutal.Core.Logging.dll',
          'Brutal.Core.Memory.dll',
          'Brutal.Core.Strings.dll',
          'Brutal.Fmod.dll',
          'Brutal.Framework.dll',
          'Brutal.Gli.dll',
          'Brutal.Gli.Texture.dll',
          'Brutal.GltfApi.dll',
          'Brutal.ImGui.Abstractions.dll',
          'Brutal.Ktx.dll',
          'Brutal.Ktx.Texture.dll',
          'Brutal.Native.dll',
          'Brutal.ShaderCompiler.dll',
          'Brutal.Stb.dll',
          'Brutal.Stb.Texture.dll',
          'Brutal.Texture.dll',
          'Brutal.Vulkan.dll',
          'Brutal.Vulkan.Abstractions.dll',
          # Already provided by StarMap mod loader
          'StarMap.API.dll',
          '0Harmony.dll'
        )

        # Copy main project DLL and all dependencies (except KSA DLLs)
        Write-Host "Copying DLLs from build output..."
        Get-ChildItem -Path $outputDir -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
          if ($excludeDlls -notcontains $_.Name) {
            Write-Host "  Copying: $($_.Name)"
            Copy-Item $_.FullName -Destination $contentDir -Force
          } else {
            Write-Host "  Skipping (excluded): $($_.Name)"
          }
        }

        # Copy deps.json file
        $depsFile = Get-ChildItem -Path $outputDir -Filter "$project.deps.json" -File -ErrorAction SilentlyContinue
        if ($depsFile) {
          Write-Host "Copying deps.json"
          Copy-Item $depsFile.FullName -Destination $contentDir -Force
        } else {
          Write-Warning "deps.json not found"
        }

        # Copy mod.toml
        $modPaths = @("$project/mod.toml", "./mod.toml", "KittenRemoteControl/mod.toml")
        $copiedMod = $false
        foreach ($p in $modPaths) {
          if (Test-Path $p) {
            Write-Host "Copying mod.toml from $p"
            Copy-Item $p $contentDir -Force
            $copiedMod = $true
            break
          }
        }
        if (-not $copiedMod) { Write-Warning "mod.toml not found in known locations." }

        # Copy README
        if (Test-Path "README.md") {
          Write-Host "Copying README.md"
          Copy-Item "README.md" $contentDir -Force
        } else {
          Write-Warning "README.md not found."
        }

        # Copy LICENSE
        if (Test-Path "LICENSE") {
          Write-Host "Copying LICENSE"
          Copy-Item "LICENSE" $contentDir -Force
        } else {
          Write-Warning "LICENSE not found."
        }

        # Copy NOTICE.txt
        if (Test-Path "NOTICE.txt") {
          Write-Host "Copying NOTICE.txt"
          Copy-Item "NOTICE.txt" $contentDir -Force
        } else {
          Write-Warning "NOTICE.txt not found."
        }

        # Copy OpenAPI documentation
        if (Test-Path "openapi.yaml") {
          Write-Host "Copying openapi.yaml"
          Copy-Item "openapi.yaml" $contentDir -Force
        }

        # Copy licenses directory
        if (Test-Path "licenses") {
          Write-Host "Copying licenses directory"
          Copy-Item "licenses" -Destination $contentDir -Recurse -Force
        } else {
          Write-Warning "licenses directory not found."
        }

        # Create zip - archive the content directory directly
        $zipName = "$project.zip"
        if (Test-Path $zipName) { Remove-Item $zipName -Force }
        Compress-Archive -Path $contentDir -DestinationPath $zipName -Force

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "Created $zipName containing:"
        Write-Host "=========================================="
        Get-ChildItem -Path $contentDir -Recurse | ForEach-Object {
          $relativePath = $_.FullName.Substring($contentDir.Length + 1)
          if ($_.PSIsContainer) {
            Write-Host "  [DIR]  $relativePath"
          } else {
            $sizeKb = [math]::Round($_.Length / 1KB, 2)
            Write-Host "  [FILE] $relativePath ($sizeKb KB)"
          }
        }
        Write-Host "=========================================="
      shell: powershell

    - name: Clean up SSH key
      if: always()
      run: |
        rm -f ~/.ssh/id_rsa
      shell: bash

    - name: Remove cloned DLLs
      if: always()
      run: |
        Remove-Item -Recurse -Force KSA_dlls -ErrorAction SilentlyContinue
      shell: powershell

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KittenRemoteControl
        path: KittenRemoteControl.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: KittenRemoteControl.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
